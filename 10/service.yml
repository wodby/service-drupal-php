name: drupal10-php
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.4.5"
title: PHP (Drupal 10)
labels:
- drupal
- drupal10

options:
- version: '8.2'
  tag: 8.2-r23
  digest: sha256:3d62d275f642edc784d37f1cd57bd8cb6154212faa6e482e63725f465f533764
  devTag: 8.2-dev-r23
  devDigest: sha256:f6ef3a69e7b0b914b3c24aa6bff4fb12b38428a9efbd34423be73b617c225a8c
- version: '8.3'
  tag: 8.3-r23
  digest: sha256:54f680d879592b3c99d9853c029ee0733beb2d2b5e1275979a210e1320e12bb3
  devTag: 8.3-dev-r23
  devDigest: sha256:5a3b2ca102870e6a94847887eeb4aa618d3ef81992f0800a0d70821b0de48e62
- version: '8.4'
  default: true
  tag: 8.4-r23
  digest: sha256:9b5e10a005299cd50b6b44b115b63150ce2892a52f2ecb0db50670000a28d811
  devTag: 8.4-dev-r23
  devDigest: sha256:1af9821478f69f73de05bc599bd3443b776399e52246f44031278b5d4505860c
derivatives:
- name: drupal10-php-sshd
  icon: ssh
  title: SSHD
  args: ['sudo', '/usr/sbin/sshd', '-De']
  type: ssh
  default: true
  required: false
  endpoints:
  - name: sshd
    ports:
    - name: sshd
      main: true
      number: 22
      protocol: tcp
  env:
  - name: SSHD_GATEWAY_PORTS
    value: clientspecified
  helm:
    values:
    - name: livenessProbe
      value: ""
    - name: readinessProbe
      value: ""
    - name: containerPort.name
      value: sshd
    - name: containerPort.number
      value: 22
links:
- name: db
  required: true
- name: files
  title: Files storage
  required: true
  selectors:
  - type: storage
- name: solr
  title: Solr
  env:
  - name: SOLR_CLOUD_SERVER
    value: '{{link.host}}'
  - name: SOLR_CLOUD_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: search
    labels:
    - solr
- name: redis
  title: Redis
  env:
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: files
  title: Files
  shared: true
  size: 10
  link: files
  path: /mnt/files
  import:
    owner: 82
    group: 82

cron:
- name: drush
  title: drush cron
  command: drush -r ${HTTP_ROOT} -l ${WODBY_PRIMARY_URL} cron
  schedule: 0 0 * * *

env:
- name: DRUPAL_FILES_SYNC_SALT
  value: '{{sync_salt}}'
  secret: true
- name: DRUPAL_HASH_SALT
  value: '{{hash_salt}}'
  secret: true
- name: DRUPAL_VERSION
  value: '10'
- name: HTTP_ROOT
  # Kubernetes does not expand shell variables in env values, so the root is built from the image's APP_ROOT
  # (/var/www/html) and the docroot setting.
  value: '/var/www/html/{{settings.docroot}}'
- name: WODBY2_SERVICE_INIT_ACTION
  value: init-drupal

build:
  connect: true
  boilerplates:
  - name: vanilla
    title: Vanilla Drupal
    repo: https://github.com/wodby/drupal-vanilla
    branch: 10.x

settings:
- name: docroot
  title: Drupal root subdirectory
  description: Composer-based projects have Drupal under 'web' directory by default
  placeholder: path/relative/to/git/root
  default: web
  var: DOCROOT_SUBDIR
- name: sitedir
  title: Drupal site dir
  required: true
  default: default
  var: DRUPAL_SITE

tokens:
- name: sync_salt
  generate:
    regex: '[0-9a-z]{32}'
- name: hash_salt
  generate:
    regex: '[0-9a-z]{32}'

actions:
- name: clear_cache
  args: ['drush', 'cr']
  type: button
  title: Rebuild all cache
- name: user_login
  args: ['make', 'user-login']
  type: button
  title: Generate one-time login link
- name: updb
  args: ['drush', 'updb']
  type: button
  title: Apply pending database updates

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/drupal-php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
